[package]
name = "pgpulse-exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.17"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
prometheus = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
